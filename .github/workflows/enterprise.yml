name: Operations foundation checks
on:
  push:
    branches: [enterprise-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: cp firebase-applet-config.example.json firebase-applet-config.json
      - run: npm run test:enterprise
      - run: npm run lint
      - run: npm run enterprise:build
      - run: npm audit --audit-level=high
